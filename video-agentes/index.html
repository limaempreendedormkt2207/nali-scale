<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Agentes Nali — Motion 15s</title>
<style>
@font-face{font-family:Sora;font-weight:400;src:url(fonts/sora-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:600;src:url(fonts/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:700;src:url(fonts/sora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Sora;font-weight:800;src:url(fonts/sora-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:JBM;font-weight:500;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:JBM;font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2")}

:root{
  --bg:#07080F; --ink:#F3F4FA; --muted:#8B90A8; --dim:#4C5170;
  --lime:#C4FF4D; --violet:#7C5CFF; --panel:#0E1020;
}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Sora,sans-serif;color:var(--ink);background:var(--bg)}
.abs{position:absolute;left:0;top:0}
.mask{display:block;overflow:hidden;padding:0 4px}
.mask>.in{display:inline-block;will-change:transform}
.mono{font-family:JBM,monospace;font-weight:500;letter-spacing:.12em;text-transform:uppercase}

/* background */
.blob{position:absolute;border-radius:50%;filter:blur(40px)}
#glowA{width:1100px;height:1100px;background:radial-gradient(circle,rgba(124,92,255,.42) 0%,rgba(124,92,255,0) 65%)}
#glowB{width:1000px;height:1000px;background:radial-gradient(circle,rgba(196,255,77,.16) 0%,rgba(196,255,77,0) 65%)}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.65) 100%)}

/* hook */
#hook{left:96px;top:560px;width:900px}
#hook .label{font-size:30px;color:var(--lime);margin-bottom:26px}
#hook .l-sm{font-size:92px;font-weight:600;line-height:1.08;letter-spacing:-.02em}
#hook .l-sm.mut{color:var(--muted)}
#hook .l-xl{font-size:176px;font-weight:800;line-height:1.0;letter-spacing:-.045em;margin-top:6px}
#hook .l-xl .ch{display:inline-block;will-change:transform}
#h3{color:var(--lime)}
#cursor{display:inline-block;width:64px;height:136px;background:var(--lime);margin-left:18px;vertical-align:-6px}

/* headers */
.hdr{left:96px;top:236px;width:900px}
.hdr .k{font-size:26px;color:var(--lime);margin-bottom:14px}
.hdr .t{font-size:62px;font-weight:700;letter-spacing:-.025em;line-height:1.1}

/* briefing card */
#card{left:120px;top:1150px;width:840px;height:360px;border-radius:36px;
  background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
  border:1.5px solid rgba(255,255,255,.14);padding:34px 44px;
  box-shadow:0 40px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08)}
#card .top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
#card .dot{width:16px;height:16px;border-radius:50%;background:#2B2F47}
#card .dot.on{background:var(--lime)}
#card .fname{margin-left:auto;font-size:22px;color:var(--muted)}
#card .row{display:flex;align-items:baseline;gap:26px;height:76px;border-top:1px solid rgba(255,255,255,.07)}
#card .row .k{width:190px;font-size:22px;color:var(--lime);padding-top:22px}
#card .row .v{font-size:40px;font-weight:600;letter-spacing:-.01em;padding-top:16px;white-space:nowrap}
#card .caret{display:inline-block;width:4px;height:40px;background:var(--lime);margin-left:4px;vertical-align:-6px}

/* captions */
.cap{left:96px;top:1196px;width:900px}
.cap .idx{font-size:28px;color:var(--lime);margin-bottom:6px}
.cap .ttl{font-size:112px;font-weight:800;letter-spacing:-.045em;line-height:1.08}
.cap .sub{font-size:40px;line-height:1.3;color:#B9BDD3;margin-top:10px;width:900px;white-space:nowrap}
.cap .mask>.in{display:block}
.cap .chips{display:flex;gap:14px;margin-top:26px}
.cap .chip{font-family:JBM,monospace;font-weight:500;font-size:24px;letter-spacing:.04em;color:var(--ink);
  padding:12px 22px;border-radius:999px;border:1.5px solid rgba(196,255,77,.45);background:rgba(196,255,77,.07)}

/* end card */
#wipe{position:absolute;left:540px;top:740px;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--lime)}
#end{left:0;top:0;width:1080px;height:1920px;color:#07080F}
#endInner{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
#endGlow{position:absolute;left:40px;top:400px;width:1000px;height:1000px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 60%)}
#endKicker{position:absolute;left:0;width:1080px;top:600px;text-align:center;font-size:28px;letter-spacing:.3em}
#logo{position:absolute;left:0;top:660px;width:1080px;text-align:center;font-size:250px;font-weight:800;letter-spacing:-.055em;line-height:1}
#logo .ch{display:inline-block}
#logo .mask{display:inline-block;padding:0 6px}
#logoSub{position:absolute;left:0;width:1080px;top:935px;text-align:center;font-family:JBM,monospace;font-weight:700;font-size:58px}
#rule{position:absolute;top:1052px;left:540px;height:5px;background:#07080F;border-radius:3px}
#tag{position:absolute;left:0;width:1080px;top:1110px;text-align:center;font-size:58px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
#tag .pill{display:inline-block;background:#07080F;color:var(--lime);padding:2px 26px 8px;border-radius:18px}
#foot{position:absolute;left:0;width:1080px;top:1330px;text-align:center;font-size:24px;letter-spacing:.18em;opacity:.7}
</style>
</head>
<body>
<div id="stage">

  <!-- BACKGROUND -->
  <div id="bg" class="abs" style="width:1080px;height:1920px">
    <div id="glowA" class="blob"></div>
    <div id="glowB" class="blob"></div>
    <svg class="abs" width="1080" height="1920">
      <defs>
        <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
          <circle cx="24" cy="24" r="2" fill="#ffffff"/>
        </pattern>
        <radialGradient id="gridFade" cx="50%" cy="42%" r="60%">
          <stop offset="0" stop-color="#fff" stop-opacity="1"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <mask id="gridMask"><rect width="1080" height="1920" fill="url(#gridFade)"/></mask>
      </defs>
      <g mask="url(#gridMask)" opacity=".10"><rect id="gridRect" x="-48" y="-48" width="1176" height="2016" fill="url(#dots)"/></g>
    </svg>
    <div id="vignette"></div>
  </div>

  <!-- DIAGRAM + CORE -->
  <svg id="fx" class="abs" width="1080" height="1920" style="overflow:visible">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="16" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="coreGlow">
        <stop offset="0" stop-color="#7C5CFF" stop-opacity=".75"/>
        <stop offset=".45" stop-color="#7C5CFF" stop-opacity=".22"/>
        <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="innerFill" cx="40%" cy="35%">
        <stop offset="0" stop-color="#1D2140"/>
        <stop offset="1" stop-color="#0B0D1A"/>
      </radialGradient>
    </defs>

    <g id="diagram" transform="translate(540 740)">
      <circle id="track" r="250" fill="none" stroke="#252943" stroke-width="3"/>
      <circle id="prog" r="250" fill="none" stroke="#C4FF4D" stroke-width="6" stroke-linecap="round" transform="rotate(-90)" filter="url(#glow)"/>
      <g id="spokes"></g>
      <g id="nodes"></g>
      <g id="trail"></g>
      <circle id="spark" r="11" fill="#F6FFE0" filter="url(#bigGlow)"/>
    </g>

    <g id="core" transform="translate(540 740)">
      <circle id="cGlow" r="260" fill="url(#coreGlow)"/>
      <circle id="shock" r="100" fill="none" stroke="#C4FF4D" stroke-width="4"/>
      <circle id="shock2" r="100" fill="none" stroke="#7C5CFF" stroke-width="3"/>
      <g id="cRings">
        <circle id="ring2" r="150" fill="none" stroke="#7C5CFF" stroke-width="2.5" stroke-dasharray="3 13" stroke-linecap="round"/>
        <circle id="ring1" r="118" fill="none" stroke="#C4FF4D" stroke-width="4" stroke-dasharray="46 22" stroke-linecap="round" filter="url(#glow)"/>
        <circle r="88" fill="url(#innerFill)" stroke="rgba(196,255,77,.35)" stroke-width="2"/>
        <path id="star" d="M0 -44 C 7 -11 11 -7 44 0 C 11 7 7 11 0 44 C -7 11 -11 7 -44 0 C -11 -7 -7 -11 0 -44 Z" fill="#C4FF4D" filter="url(#glow)"/>
        <path id="star2" d="M0 -16 C 3 -4 4 -3 16 0 C 4 3 3 4 0 16 C -3 4 -4 3 -16 0 C -4 -3 -3 -4 0 -16 Z" fill="#F3F4FA" transform="translate(34 -34)"/>
      </g>
    </g>
    <g id="particles"></g>
  </svg>

  <!-- S1 HOOK -->
  <div id="hook" class="abs">
    <div class="label mono mask"><span class="in" id="h0">// Nali Scale · IA</span></div>
    <div class="l-sm mask"><span class="in" id="h1">Como funcionam</span></div>
    <div class="l-sm mut mask"><span class="in" id="h2">os nossos</span></div>
    <div class="l-xl mask"><span class="in" id="h3"></span></div>
    <div class="l-xl mask"><span class="in" id="h4"></span><span id="cursor"></span></div>
  </div>

  <!-- HEADERS -->
  <div id="hdr2" class="abs hdr">
    <div class="k mono mask"><span class="in">01 · Entrada</span></div>
    <div class="t mask"><span class="in">Você envia o briefing.</span></div>
  </div>
  <div id="hdr3" class="abs hdr">
    <div class="k mono mask"><span class="in">02 · O agente em ação</span></div>
    <div class="t mask"><span class="in">Ele roda o ciclo sozinho.</span></div>
  </div>

  <!-- BRIEFING CARD -->
  <div id="card" class="abs">
    <div class="top"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="fname mono">briefing.txt</span></div>
    <div class="row"><span class="k mono">negócio</span><span class="v" data-text="Clínica odontológica"></span></div>
    <div class="row"><span class="k mono">objetivo</span><span class="v" data-text="Mais agendamentos"></span></div>
    <div class="row"><span class="k mono">canal</span><span class="v" data-text="Instagram + Meta Ads"></span></div>
  </div>

  <!-- CAPTIONS -->
  <div id="caps"></div>

  <!-- END CARD -->
  <div id="wipe"></div>
  <div id="end" class="abs">
    <div id="endInner">
      <div id="endGlow"></div>
      <svg id="endStar" width="120" height="120" viewBox="-60 -60 120 120" style="position:absolute;left:480px;top:450px;overflow:visible">
        <path d="M0 -44 C 7 -11 11 -7 44 0 C 11 7 7 11 0 44 C -7 11 -11 7 -44 0 C -11 -7 -7 -11 0 -44 Z" fill="#07080F"/>
      </svg>
      <div id="endKicker" class="mono">Agentes de IA</div>
      <div id="logo"></div>
      <div id="logoSub">SCALE</div>
      <div id="rule"></div>
      <div id="tag"><span id="tag1">Menos achismo.</span><br><span class="pill" id="tag2">Mais escala.</span></div>
      <div id="foot" class="mono">tráfego · CRM · automação · IA</div>
    </div>
  </div>
</div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inCubic: x => x * x * x,
  inQuart: x => x * x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inOutQuint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function css(el, { x = 0, y = 0, s = 1, r = 0, o = null, blur = null, origin = null } = {}) {
  el.style.transform = `translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
  if (o !== null) el.style.opacity = o;
  if (blur !== null) el.style.filter = blur > 0.05 ? `blur(${blur}px)` : 'none';
  if (origin) el.style.transformOrigin = origin;
}
function vis(el, on) { el.style.visibility = on ? 'visible' : 'hidden'; }
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function splitChars(el, text) {
  el.innerHTML = '';
  return [...text].map(c => {
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = c === ' ' ? ' ' : c;
    el.appendChild(s);
    return s;
  });
}
/* ---------- timeline (seconds; beat grid = 0.3 + 0.35n) ---------- */
const T = {
  hookOut: 2.05,
  coreIn: 2.4,
  hdr2In: 2.55, cardIn: 2.75, typeStart: 3.1, cardFly: 4.05, absorb: 4.5,
  hdr2Out: 4.3,
  s3: 4.5, hdr3In: 4.6,
  act: [5.2, 6.6, 8.0, 9.4],
  loop: 10.8, loopFlash: 11.15, lapsEnd: 11.85,
  exit: 11.85, wipe: 12.2, logo: 12.55, sub: 12.9, tag1: 13.25, tag2: 13.6, foot: 13.95,
};

/* ---------- build: hook ---------- */
const h3c = splitChars($('#h3'), 'AGENTES');
const h4c = splitChars($('#h4'), 'DE IA.');

/* ---------- build: nodes ---------- */
const R = 250, NR = 56, C = 2 * Math.PI * R;
const ICONS = [
  // pesquisa: magnifier
  '<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L20.5 20.5"/>',
  // criação: pen
  '<path d="M4 20 L8.5 19 L19 8.5 L15.5 5 L5 15.5 Z"/><path d="M13.5 7 L17 10.5"/>',
  // execução: send
  '<path d="M21 3 L10.5 13.5"/><path d="M21 3 L14.5 21 L10.5 13.5 L3 9.5 Z"/>',
  // análise: chart up
  '<path d="M3.5 3.5 V20.5 H20.5"/><path d="M7 15 L11 11 L14 14 L20 8"/><path d="M16 8 H20 V12"/>',
];
const NAMES = ['PESQUISA', 'CRIAÇÃO', 'EXECUÇÃO', 'ANÁLISE'];
const nodesG = $('#nodes'), spokesG = $('#spokes');
const nodes = NAMES.map((name, i) => {
  const ang = -Math.PI / 2 + i * Math.PI / 2;
  const x = Math.cos(ang) * R, y = Math.sin(ang) * R;
  const spoke = svgEl('line', { x1: 0, y1: 0, x2: x, y2: y, stroke: '#C4FF4D', 'stroke-width': 3, 'stroke-dasharray': '6 14', 'stroke-linecap': 'round' }, spokesG);
  const g = svgEl('g', {}, nodesG);
  const halo = svgEl('circle', { r: NR, fill: 'none', stroke: '#C4FF4D', 'stroke-width': 3 }, g);
  const body = svgEl('g', {}, g);
  const bgc = svgEl('circle', { r: NR, 'stroke-width': 3 }, body);
  const icon = svgEl('g', { fill: 'none', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', transform: 'scale(2.35) translate(-12 -12)' }, body);
  icon.innerHTML = ICONS[i];
  const LP = [{ x: 0, y: -NR - 26, a: 'middle' }, { x: NR + 22, y: 8, a: 'start' }, { x: 0, y: NR + 44, a: 'middle' }, { x: -NR - 22, y: 8, a: 'end' }][i];
  const label = svgEl('text', { x: LP.x, y: LP.y, 'text-anchor': LP.a, 'font-family': 'JBM', 'font-weight': 700, 'font-size': 23, 'letter-spacing': 2.5 }, g);
  label.textContent = name;
  return { x, y, g, halo, body, bgc, icon, label, spoke };
});
const trailG = $('#trail');
const trail = Array.from({ length: 14 }, (_, k) => svgEl('circle', { r: 9 - k * 0.5, fill: '#C4FF4D' }, trailG));

/* ---------- build: captions ---------- */
const CAPS = [
  { idx: '01 / 04', ttl: 'PESQUISA', sub: 'Descobre o que bomba no seu nicho.', chips: ['TikTok', 'Reels', 'Meta Ads Library'] },
  { idx: '02 / 04', ttl: 'CRIAÇÃO', sub: 'Escreve copy, roteiros e criativos.', chips: ['Copy', 'Roteiros', 'Vídeos com IA'] },
  { idx: '03 / 04', ttl: 'EXECUÇÃO', sub: 'Sobe campanhas e leva leads pro CRM.', chips: ['Meta Ads', 'CRM', 'Automações'] },
  { idx: '04 / 04', ttl: 'ANÁLISE', sub: 'Lê os números e ajusta a rota.', chips: ['CPL', 'ROAS', 'Health Score'] },
  { idx: '↻ loop', ttl: 'E RECOMEÇA.', sub: '24/7, mais afiado a cada rodada.', chips: [] },
];
const capsRoot = $('#caps');
const caps = CAPS.map(c => {
  const d = document.createElement('div');
  d.className = 'abs cap';
  d.innerHTML = `<div class="idx mono mask"><span class="in">${c.idx}</span></div>
    <div class="ttl mask"><span class="in">${c.ttl}</span></div>
    <div class="sub mask"><span class="in">${c.sub}</span></div>
    <div class="chips">${c.chips.map(x => `<span class="chip">${x}</span>`).join('')}</div>`;
  capsRoot.appendChild(d);
  return { root: d, idx: d.querySelector('.idx .in'), ttl: d.querySelector('.ttl .in'), sub: d.querySelector('.sub .in'), chips: [...d.querySelectorAll('.chip')] };
});
const capIn = [...T.act, T.loop];
const capOut = [T.act[1] - .3, T.act[2] - .3, T.act[3] - .3, T.loop - .3, T.exit];

/* ---------- build: card typing ---------- */
const cardVals = [...document.querySelectorAll('#card .v')];

/* ---------- build: particles ---------- */
const partG = $('#particles');
const parts = Array.from({ length: 16 }, (_, k) => {
  const seed = Math.sin(k * 91.7) * 43758.5453; const r1 = seed - Math.floor(seed);
  const seed2 = Math.sin(k * 12.9 + 4) * 15731.743; const r2 = seed2 - Math.floor(seed2);
  return { el: svgEl('circle', { r: 3 + r2 * 4, fill: k % 3 ? '#C4FF4D' : '#ffffff' }, partG), x0: 160 + r1 * 760, delay: r2 * .32 };
});

/* ---------- build: end ---------- */
const logoEl = $('#logo');
const logoChars = [...'NALI'].map(c => {
  const m = document.createElement('span'); m.className = 'mask';
  const s = document.createElement('span'); s.className = 'ch in'; s.textContent = c;
  m.appendChild(s); logoEl.appendChild(m); return s;
});

/* ================= RENDER ================= */
function renderFrame(t) {
  /* --- background --- */
  css($('#glowA'), { x: -260 + Math.sin(t * .5) * 90, y: 120 + Math.cos(t * .4) * 120 });
  css($('#glowB'), { x: 380 + Math.cos(t * .45) * 80, y: 1000 + Math.sin(t * .35) * 120 });
  $('#gridRect').setAttribute('transform', `translate(0 ${(t * 22) % 48})`);
  const endOn = t >= T.wipe + .25;
  vis($('#bg'), !endOn);

  /* --- S1 hook --- */
  const hookVis = t < T.hookOut + .7;
  vis($('#hook'), hookVis);
  if (hookVis) {
    const push = 1 + .035 * E.inOutCubic(P(t, 0, 2.4));
    css($('#hook'), { s: push, origin: '0 50%' });
    const lines = [['#h0', .1], ['#h1', .22], ['#h2', .36]];
    lines.forEach(([sel, tin], i) => {
      const el = $(sel);
      const a = E.outQuint(P(t, tin, .65)), b = E.inCubic(P(t, T.hookOut + i * .05, .3));
      css(el, { y: ((1 - a) - b) * el.offsetHeight * 1.15 });
    });
    h3c.forEach((c, i) => {
      const a = E.outQuint(P(t, .55 + i * .035, .6)), b = E.inCubic(P(t, T.hookOut + .12 + i * .015, .3));
      css(c, { y: ((1 - a) - b) * 200, r: (1 - a) * 8 });
    });
    h4c.forEach((c, i) => {
      const a = E.outQuint(P(t, .74 + i * .035, .6)), b = E.inCubic(P(t, T.hookOut + .18 + i * .015, .3));
      css(c, { y: ((1 - a) - b) * 200, r: (1 - a) * 8 });
    });
    const cur = $('#cursor');
    const cIn = P(t, 1.0, .12), cOut = P(t, T.hookOut + .1, .1);
    cur.style.opacity = cIn * (1 - cOut) * ((Math.floor((t - 1.0) / .2) % 2 === 0 || t < 1.4) ? 1 : 0);
    css(cur, { s: 1 });
  }

  /* --- core --- */
  const coreIn = E.outBack(P(t, T.coreIn, .6));
  const absorbBump = Math.sin(Math.PI * P(t, T.absorb, .4)) * .16;
  const coreS3 = E.inOutCubic(P(t, T.s3, .5));
  const coreOut = E.inCubic(P(t, T.exit, .35));
  const coreScale = coreIn * (1 + absorbBump) * lerp(1, .78, coreS3) * (1 - coreOut);
  const core = $('#core');
  core.setAttribute('transform', `translate(540 740) scale(${Math.max(coreScale, 0.0001)})`);
  vis(core, t >= T.coreIn && t < T.wipe + .1);
  $('#ring1').setAttribute('transform', `rotate(${t * 70})`);
  $('#ring2').setAttribute('transform', `rotate(${-t * 40})`);
  const breathe = 1 + Math.sin(t * 5.2) * .05;
  $('#star').setAttribute('transform', `rotate(${t * 30}) scale(${breathe})`);
  $('#cGlow').setAttribute('opacity', .75 + Math.sin(t * 3) * .15 + absorbBump * 1.5);
  // shock waves at core appear and absorb
  const sh = (tt) => P(t, tt, .7);
  const shockP = Math.max(t >= T.absorb ? sh(T.absorb) : 0, t < T.absorb ? sh(T.coreIn + .05) : 0);
  const shockActive = (t >= T.coreIn + .05 && t < T.coreIn + .75) || (t >= T.absorb && t < T.absorb + .7);
  const shockE = E.outCubic(shockP);
  $('#shock').setAttribute('r', 90 + shockE * 260);
  $('#shock').setAttribute('opacity', shockActive ? (1 - shockP) * .9 : 0);
  $('#shock2').setAttribute('r', 90 + E.outCubic(clamp(shockP * 1.25 - .15)) * 200);
  $('#shock2').setAttribute('opacity', shockActive ? (1 - shockP) * .7 : 0);

  /* --- headers --- */
  [['#hdr2', T.hdr2In, T.hdr2Out], ['#hdr3', T.hdr3In, T.exit - .1]].forEach(([sel, tin, tout]) => {
    const root = $(sel);
    const on = t >= tin && t < tout + .5;
    vis(root, on);
    if (!on) return;
    root.querySelectorAll('.in').forEach((el, i) => {
      const a = E.outQuint(P(t, tin + i * .08, .6)), b = E.inCubic(P(t, tout + i * .04, .3));
      css(el, { y: ((1 - a) - b) * el.offsetHeight * 1.15 });
    });
  });

  /* --- briefing card --- */
  const card = $('#card');
  const cardOn = t >= T.cardIn && t < T.absorb;
  vis(card, cardOn);
  if (cardOn) {
    const a = E.outQuint(P(t, T.cardIn, .6));
    const f = E.inCubic(P(t, T.cardFly, T.absorb - T.cardFly));
    const fx = 0, fy = lerp(0, 740 - (1150 + 180), f);
    css(card, { x: fx, y: (1 - a) * 220 + fy, s: lerp(1, .06, f) * lerp(.94, 1, a), o: a * (1 - E.inQuart(f)), r: f * -6, origin: '50% 50%' });
    cardVals.forEach((v, i) => {
      const txt = v.dataset.text;
      const tp = P(t, T.typeStart + i * .3, .34);
      const n = Math.round(tp * txt.length);
      const caret = (tp > 0 && tp < 1) || (i === cardVals.length - 1 && tp >= 1 && Math.floor(t / .18) % 2 === 0);
      v.innerHTML = txt.slice(0, n) + (caret ? '<span class="caret"></span>' : '');
    });
  }

  /* --- particles card -> core --- */
  const partOn = t >= T.cardFly - .1 && t < T.absorb + .2;
  vis(partG, partOn);
  if (partOn) parts.forEach(p => {
    const q = P(t, T.cardFly - .1 + p.delay, .42);
    const e = E.inCubic(q);
    const x = lerp(p.x0, 540, e), y = lerp(1180, 740, e);
    p.el.setAttribute('cx', x); p.el.setAttribute('cy', y);
    p.el.setAttribute('opacity', q > 0 && q < 1 ? Math.sin(Math.PI * q) : 0);
  });

  /* --- diagram --- */
  const dOn = t >= T.s3 && t < T.wipe + .1;
  const diagram = $('#diagram');
  vis(diagram, dOn);
  if (dOn) {
    const out = E.inCubic(P(t, T.exit, .35));
    diagram.setAttribute('transform', `translate(540 740) scale(${1 - out * .85}) rotate(${out * 90})`);
    diagram.setAttribute('opacity', 1 - out);
    // track draw-on
    const tr = E.inOutCubic(P(t, T.s3, .55));
    const track = $('#track');
    track.setAttribute('stroke-dasharray', `${C * tr} ${C}`);
    track.setAttribute('transform', `rotate(${-90 + (1 - tr) * -60})`);
    // progress arc
    let prog = 0;
    for (let i = 1; i < 4; i++) if (t >= T.act[i] - .45) prog = (i - 1) / 4 + E.inOutCubic(P(t, T.act[i] - .45, .45)) / 4;
    if (t >= T.loop) prog = .75 + E.inOutCubic(P(t, T.loop, .35)) / 4;
    const progEl = $('#prog');
    progEl.setAttribute('stroke-dasharray', `${Math.max(C * prog, .001)} ${C}`);
    progEl.setAttribute('opacity', t >= T.act[0] ? 1 : 0);
    // spark
    let sAng = prog * Math.PI * 2;
    let sOn = 0;
    for (let i = 1; i < 4; i++) sOn = Math.max(sOn, Math.sin(Math.PI * P(t, T.act[i] - .5, .6)));
    if (t >= T.loop - .05) sOn = 1;
    const laps = P(t, T.loopFlash, T.lapsEnd - T.loopFlash);
    const lapE = E.inOutCubic(laps);
    if (t >= T.loopFlash) sAng = Math.PI * 2 * (1 + 2 * lapE);
    const angAt = a => [Math.sin(a) * R, -Math.cos(a) * R];
    const [sx, sy] = angAt(sAng);
    const spark = $('#spark');
    spark.setAttribute('cx', sx); spark.setAttribute('cy', sy);
    spark.setAttribute('opacity', clamp(sOn * 1.6));
    spark.setAttribute('r', 10 + Math.sin(t * 12) * 1.5);
    // trail during laps (velocity based)
    const speed = (t >= T.loopFlash && t < T.lapsEnd) ? Math.sin(Math.PI * laps) : 0;
    trail.forEach((c, k) => {
      const [tx, ty] = angAt(sAng - (k + 1) * .085 * speed);
      c.setAttribute('cx', tx); c.setAttribute('cy', ty);
      c.setAttribute('opacity', speed > .02 ? (1 - k / trail.length) * .8 * speed : 0);
    });
    // nodes
    nodes.forEach((n, i) => {
      const appear = E.outBack(P(t, T.s3 + .1 + i * .08, .5));
      const actT = T.act[i];
      const isDone = t >= actT;
      const isActive = isDone && (i === 3 ? t < T.loop : t < T.act[i + 1]);
      const pop = Math.sin(Math.PI * P(t, actT, .32)) * .2;
      // flash when loop spark passes (each lap passes every node)
      let flash = 0;
      if (t >= T.loopFlash && t < T.lapsEnd + .2) {
        const sNorm = (sAng / (Math.PI * 2)) % 1;
        const nodeNorm = i / 4;
        let dd = Math.abs(sNorm - nodeNorm); dd = Math.min(dd, 1 - dd);
        flash = clamp(1 - dd * 9);
      }
      if (t >= T.loop && t < T.loopFlash + .35 && i === 0) flash = Math.max(flash, Math.sin(Math.PI * P(t, T.loopFlash - .05, .4)));
      const scale = appear * (1 + pop + flash * .12);
      n.g.setAttribute('transform', `translate(${n.x} ${n.y}) scale(${Math.max(scale, .0001)})`);
      const lit = isActive || flash > .35;
      n.bgc.setAttribute('fill', lit ? '#C4FF4D' : (isDone ? '#141833' : '#0E1020'));
      n.bgc.setAttribute('stroke', isDone || lit ? '#C4FF4D' : '#2A2E48');
      n.bgc.setAttribute('filter', lit ? 'url(#glow)' : '');
      n.icon.setAttribute('stroke', lit ? '#07080F' : (isDone ? '#C4FF4D' : '#5A5F80'));
      n.label.setAttribute('fill', isActive ? '#F3F4FA' : (isDone ? '#C4FF4D' : '#4C5170'));
      n.label.setAttribute('opacity', appear);
      // halo ripple while active
      const hp = isActive ? ((t - actT) % .7) / .7 : 1;
      n.halo.setAttribute('r', NR + E.outCubic(hp) * 40);
      n.halo.setAttribute('opacity', isActive ? (1 - hp) * .6 : 0);
      // spoke
      const sp = isActive ? E.outCubic(P(t, actT, .3)) : 0;
      n.spoke.setAttribute('x1', n.x * .5); n.spoke.setAttribute('y1', n.y * .5);
      n.spoke.setAttribute('x2', n.x * lerp(.5, .74, sp)); n.spoke.setAttribute('y2', n.y * lerp(.5, .74, sp));
      n.spoke.setAttribute('stroke-dashoffset', -t * 60);
      n.spoke.setAttribute('opacity', sp * .9);
    });
  }

  /* --- captions --- */
  caps.forEach((c, i) => {
    const tin = capIn[i], tout = capOut[i];
    const on = t >= tin && t < tout + .45;
    vis(c.root, on);
    if (!on) return;
    [c.idx, c.ttl, c.sub].forEach((el, k) => {
      const a = E.outQuint(P(t, tin + k * .06, .55)), b = E.inCubic(P(t, tout + k * .03, .28));
      css(el, { y: ((1 - a) - b) * el.offsetHeight * 1.15 });
    });
    c.chips.forEach((el, k) => {
      const a = E.outBack(P(t, tin + .16 + k * .07, .45)), b = E.inCubic(P(t, tout, .25));
      css(el, { y: (1 - a) * 30 - b * 30, s: lerp(.6, 1, clamp(a, 0, 1.2)), o: clamp(a) * (1 - b), origin: '0 50%' });
    });
  });

  /* --- wipe + end card --- */
  const wipe = $('#wipe');
  const wp = E.inOutQuint(P(t, T.wipe - .1, .45));
  vis(wipe, t >= T.wipe - .1);
  css(wipe, { s: Math.max(wp * 460, .001) });
  const end = $('#end');
  vis(end, t >= T.wipe + .15);
  if (t >= T.wipe + .15) {
    const z = 1 + .04 * E.inOutCubic(P(t, T.wipe, 15 - T.wipe));
    css($('#endInner'), { s: z });
    const st = E.outBack(P(t, T.wipe + .2, .55));
    css($('#endStar'), { s: Math.max(st, 0) * (1 + Math.sin(t * 5.2) * .04), r: (1 - st) * -120 + (t - T.wipe) * 25, origin: '50% 50%' });
    const kick = E.outQuint(P(t, T.logo - .15, .5));
    css($('#endKicker'), { y: (1 - kick) * 20, o: kick * .75 });
    logoChars.forEach((c, i) => {
      const a = E.outQuint(P(t, T.logo + i * .05, .65));
      css(c, { y: (1 - a) * 280, r: (1 - a) * 10 });
    });
    const sa = E.outQuint(P(t, T.sub, .7));
    const sub = $('#logoSub');
    sub.style.letterSpacing = lerp(1.4, .62, sa) + 'em';
    sub.style.textIndent = lerp(1.4, .62, sa) + 'em';
    css(sub, { o: sa });
    const rw = E.outExpo(P(t, T.sub + .1, .6)) * 380;
    const rule = $('#rule');
    rule.style.width = rw + 'px'; rule.style.marginLeft = -rw / 2 + 'px';
    const a1 = E.outQuint(P(t, T.tag1, .55));
    css($('#tag1'), { o: a1, y: (1 - a1) * 40 });
    $('#tag1').style.display = 'inline-block';
    const a2 = E.outBack(P(t, T.tag2, .5));
    css($('#tag2'), { o: clamp(a2), s: lerp(.7, 1, a2), origin: '50% 50%' });
    const af = E.outCubic(P(t, T.foot, .5));
    css($('#foot'), { o: af * .7, y: (1 - af) * 16 });
  }
}

window.renderFrame = renderFrame;
window.ready = document.fonts.ready.then(() => { renderFrame(0); return true; });
// preview mode: open index.html?play in a browser to watch in real time
if (location.search.includes('play')) {
  let t0 = null;
  const loop = ts => { if (t0 === null) t0 = ts; renderFrame(((ts - t0) / 1000) % 15); requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
